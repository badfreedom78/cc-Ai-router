name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    name: offline self-test (${{ matrix.os }} / py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: python -m pip install --upgrade pip httpx fastapi uvicorn

      - name: Create config.yaml from the template
        # The offline self-test reads config.yaml. The repository ships only the
        # placeholder template, so generate a throwaway config for the test run.
        run: python -c "import shutil; shutil.copy('config.example.yaml', 'config.yaml')"

      - name: Run offline self-test
        run: python tests/test_offline.py
